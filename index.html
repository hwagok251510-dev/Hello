<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화곡중학교 | AI 체험 연결</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      background: #0b1020;
      color: #ffffff;
    }

    header {
      padding: 30px 20px;
      text-align: center;
      background: linear-gradient(135deg, #172554, #312e81);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #c7d2fe;
      margin-top: 10px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }

    .panel {
      background: #151c30;
      border: 1px solid #303b59;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: #a5b4fc;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0b1020;
      color: white;
      font-size: 16px;
      margin: 12px 0;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      font-size: 15px;
      cursor: pointer;
      margin: 5px 5px 5px 0;
    }

    button:hover {
      background: #818cf8;
    }

    .secondary {
      background: #334155;
    }

    .danger {
      background: #be123c;
    }

    iframe {
      width: 100%;
      height: 650px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: white;
      display: none;
    }

    #status {
      color: #cbd5e1;
      margin-top: 12px;
      word-break: break-word;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>화곡중학교 AI 체험</h1>
  <p>우리의 아이디어를 인공지능으로 실현해 보세요</p>
</header>

<main>

  <section class="panel">
    <h2>AI 체험 연결</h2>

    <p>
      아래에 Gradio AI 체험 사이트 주소를 입력하고 연결 버튼을 눌러 주세요.
    </p>

    <input
      type="url"
      id="aiUrl"
      placeholder="https://your-ai-space.hf.space"
    >

    <button id="aiSave">AI 연결하기</button>
    <button class="secondary" id="aiOpen">새 창에서 열기</button>
    <button class="danger" id="aiDisconnect">연결 해제</button>

    <div id="status">AI 사이트 주소를 입력해 주세요.</div>
  </section>

  <section class="panel">
    <h2>실시간 AI 체험</h2>

    <iframe
      id="aiFrame"
      title="AI 체험 화면"
      allow="clipboard-read; clipboard-write"
      loading="lazy">
    </iframe>
  </section>

</main>

<footer>
  화곡중학교 한마음축제 · AI 체험
</footer>

<script>
  const aiUrl = document.getElementById("aiUrl");
  const aiFrame = document.getElementById("aiFrame");
  const status = document.getElementById("status");

  const STORAGE_KEY = "hwagokFestivalNeonV1_aiOnly";

  function isValidUrl(value) {
    try {
      const url = new URL(value);

      return url.protocol === "https:" ||
             url.protocol === "http:";
    } catch {
      return false;
    }
  }

  function connectAI(url) {
    if (!isValidUrl(url)) {
      status.textContent =
        "올바른 AI 사이트 주소를 입력해 주세요.";
      return;
    }

    aiUrl.value = url;

    localStorage.setItem(STORAGE_KEY, url);

    aiFrame.src = url;
    aiFrame.style.display = "block";

    status.textContent =
      "AI 사이트 연결을 시도하고 있습니다.";

    aiFrame.onload = function () {
      status.textContent =
        "AI 사이트가 연결되었습니다.";
    };
  }

  document.getElementById("aiSave").addEventListener(
    "click",
    function () {
      connectAI(aiUrl.value.trim());
    }
  );

  document.getElementById("aiOpen").addEventListener(
    "click",
    function () {
      const url = aiUrl.value.trim();

      if (!isValidUrl(url)) {
        status.textContent =
          "먼저 올바른 AI 사이트 주소를 입력해 주세요.";
        return;
      }

      window.open(url, "_blank", "noopener,noreferrer");
    }
  );

  document.getElementById("aiDisconnect").addEventListener(
    "click",
    function () {
      localStorage.removeItem(STORAGE_KEY);

      aiFrame.src = "about:blank";
      aiFrame.style.display = "none";

      aiUrl.value = "";

      status.textContent = "AI 연결이 해제되었습니다.";
    }
  );

  window.addEventListener("DOMContentLoaded", function () {
    const savedUrl = localStorage.getItem(STORAGE_KEY);

    if (savedUrl) {
      aiUrl.value = savedUrl;
      connectAI(savedUrl);
    }
  });
</script>

</body>
</html>
